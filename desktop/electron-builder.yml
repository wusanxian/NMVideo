# Electron 打包配置：AI 动画导演工作台（Windows）
# 安装包含：Electron 壳 + launcher.exe（PyInstaller 单文件，内含前后端全部代码）
# 自动更新：electron-updater + GitHub Releases（latest.yml 随 Release 上传）

appId: com.aivideo.studio
productName: AI动画导演工作台
copyright: Copyright (c) 2026 aivideo

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - renderer/**
  - package.json

# launcher.exe 放进 resources/launcher/，main.js 从这里 spawn
extraResources:
  - from: ../packaging/dist/AI视频工坊-v1.0.0.exe
    to: launcher/AI视频工坊-v1.0.0.exe

# 本地 electron 发行 zip 目录（GitHub 不通时的关键配置）：
# 目录内需直接存放 electron-v<版本>-win32-x64.zip（build-desktop.bat 会自动准备）
electronDist: electron-dist

win:
  target:
    - target: nsis
      arch: x64
  # 不自定义 artifactName：保持默认 setup 名，与 latest.yml 内的 path 一致
  # （不一致会导致自动更新找不到安装包）
  # 无框窗口，图标用资源里的
  icon: build/icon.png
  # 不签名也不编辑 exe 资源：本机构建无需 winCodeSign（其 7z 内含 macOS symlink，
  # 非提权进程解压会失败）；正式发布如需签名再打开
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: AI 动画导演工作台
  # 卸载时清理 runtime（模型/环境，可能几十 GB）——勾选默认不删，用户可选
  deleteAppDataOnUninstall: false

# 发布：GitHub Releases（owner/repo 与 NMVideo 仓库对应）
publish:
  provider: github
  owner: wusanxian
  repo: NMVideo
  releaseType: release

# electron 版本用 package.json devDependencies 里的（本地已装，不再远程下载）
# 若 GitHub 不通导致任何资源下载失败，可设置镜像：
#   set ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
