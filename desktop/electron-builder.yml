# Electron 打包配置：NMVideo（Windows）
# 安装包含：Electron 壳 + NMVideo.exe（PyInstaller 单文件，内含前后端全部代码）
# 自动更新：electron-updater + GitHub Releases（latest.yml 随 Release 上传）

appId: com.aivideo.studio
productName: NMVideo
copyright: Copyright (c) 2026 wusanxian (NMVideo)

directories:
  output: dist
  buildResources: build

files:
  - main.js
  - preload.js
  - security.js
  - backend-service.js
  - renderer/**
  - package.json

# NMVideo.exe 放进 resources/launcher/，main.js 从这里 spawn
# 协议文件随包分发（安装目录 resources/licenses/ 下）
extraResources:
  - from: ../packaging/dist/NMVideo.exe
    to: launcher/NMVideo.exe
  - from: ../LICENSE
    to: licenses/LICENSE
  - from: ../NOTICE
    to: licenses/NOTICE

# 本地 electron 发行 zip 目录（GitHub 不通时的关键配置）：
# 目录内需直接存放 electron-v<版本>-win32-x64.zip（build-desktop.bat 会自动准备）
electronDist: electron-dist

win:
  artifactName: aivideo-desktop-setup-${version}.${ext}
  target:
    - target: nsis
      arch: x64
  # 固定安装包命名，使本地文件与 latest.yml 一致，避免构建后再重命名。
  # 无框窗口，图标用资源里的
  icon: build/icon.png
  # 不签名也不编辑 exe 资源：本机构建无需 winCodeSign（其 7z 内含 macOS symlink，
  # 非提权进程解压会失败）；正式发布如需签名再打开
  signAndEditExecutable: false

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  allowElevation: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NMVideo
  # 卸载时清理 runtime（模型/环境，可能几十 GB）——勾选默认不删，用户可选
  deleteAppDataOnUninstall: false

# 发布：GitHub Releases（owner/repo 与 NMVideo 仓库对应）
publish:
  provider: github
  owner: wusanxian
  repo: NMVideo
  releaseType: release

# electron 版本用 package.json devDependencies 里的（本地已装，不再远程下载）
# 若 GitHub 不通导致任何资源下载失败，可设置镜像：
#   set ELECTRON_BUILDER_BINARIES_MIRROR=https://npmmirror.com/mirrors/electron-builder-binaries/
